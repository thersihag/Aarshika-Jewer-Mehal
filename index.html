    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Share functionality using Web Share API
        const shareButton = document.getElementById('shareButton');
        
        shareButton.addEventListener('click', async () => {
            const shareData = {
                title: 'Aarshika Jewer Mehal',
                text: 'Premium Jeweler in Hansi, Haryana.',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback to clipboard if Web Share API is not supported
                    await navigator.clipboard.writeText(window.location.href);
                    
                    // Simple custom notification instead of alert()
                    const originalText = shareButton.innerHTML;
                    shareButton.innerHTML = '<i class="fa-solid fa-check"></i> Link Copied!';
                    shareButton.classList.add('bg-gold-500', 'text-brand-dark');
                    
                    setTimeout(() => {
                        shareButton.innerHTML = originalText;
                        shareButton.classList.remove('bg-gold-500', 'text-brand-dark');
                    }, 2000);
                }
            } catch (err) {
                console.error('Error sharing:', err);
            }
        });
    </script>
